<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pesquisa Já Tem</title>
<meta name="description" content="Pesquisa de 3 minutos sobre comida em casa. Ajude a criar o Já Tem.">
<meta property="og:title" content="Pesquisa rápida: como é a comida aí na sua casa?">
<meta property="og:description" content="3 minutos, quase tudo com um toque. Quem deixar o contato ganha 1 mês grátis no lançamento.">
<meta property="og:image" content="https://jatemapp.github.io/og.png">
<meta name="theme-color" content="#F5F7EF">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma pergunta por tela, coluna única centralizada; barra de progresso fixa no topo; opções como botões grandes */
:root{
  --bg:#F5F7EF; --surface:#FFFFFF; --ink:#16201A; --muted:#5B6758; --line:#DDE4D3;
  --green:#16432B; --green-2:#1F6B42; --leaf:#CFE8B8; --tomato:#E5462C; --yolk:#FFC53D;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body)}
.app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:14px 10px;z-index:2;display:flex;align-items:center;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--green);flex:none;border:1px solid var(--line)}
.back:disabled{opacity:.3;cursor:default}
.prog{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green-2);border-radius:4px;transition:width .3s}
.count{font-size:13px;font-weight:600;color:var(--muted);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.screen{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:18px 32px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.prog i{transition:none}}
.kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green-2);margin:0}
h1,h2{font-family:var(--f-display);font-weight:800;letter-spacing:-.015em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:38px;color:var(--green)}
h2{font-size:27px}
.hint{color:var(--muted);margin:-8px 0 0;font-size:15px}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:600;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:15px 18px;min-height:58px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:12px}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--green-2);background:#E9F5DF}
.opt .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .tick{background:var(--green-2);border-color:var(--green-2)}
.opt[aria-pressed="true"] .tick::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale .opt{flex-direction:column;justify-content:center;text-align:center;padding:12px 4px;font-size:14px;gap:6px;min-height:84px}
.scale .opt b{font-family:var(--f-display);font-size:24px;line-height:1}
.btn{font:inherit;font-weight:700;font-size:18px;border:0;border-radius:16px;padding:16px 20px;min-height:58px;cursor:pointer;background:var(--tomato);color:#fff;box-shadow:0 4px 0 #A82F1B;width:100%}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.btn.green{background:var(--green);box-shadow:0 4px 0 #0B2A1A}
.concept{background:var(--green);color:#fff;border-radius:22px;padding:22px}
.concept h2{color:#fff;font-size:28px}
.concept p{margin:10px 0 0;opacity:.92}
.concept ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.concept li{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-weight:600}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:15px}
.field input{font:inherit;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 16px;min-height:54px;width:100%;color:inherit}
.field input:focus{border-color:var(--green-2);outline:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.consent input{width:22px;height:22px;flex:none;accent-color:var(--green-2);margin-top:1px}
.err{color:#B3261E;font-weight:600;font-size:15px;margin:0}
.share{display:grid;gap:10px}
.share a{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:16px;padding:16px;border:2px solid var(--green);color:var(--green)}
.share a.wa{background:var(--green);color:#fff}
.test{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 16px}
.big{font-size:56px;line-height:1}
</style>

<div class="app">
  <div class="bar" id="bar" hidden>
    <button class="back" id="back" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="prog" role="progressbar" aria-label="Progresso da pesquisa" aria-valuemin="0" aria-valuemax="100"><i id="progi" style="width:0"></i></div>
    <span class="count" id="count"></span>
  </div>
  <main id="screen" class="screen" aria-live="polite"></main>
  <p class="test" id="testnote" hidden>Prévia de teste: as respostas ainda não são enviadas.</p>
</div>

<script>
(function(){
// Para ligar ao Google Forms: preencha FORM_URL e o mapa ENTRY (chave da pergunta → entry.XXXX)
const FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLScEklDyy6a5kteuVF1yhhjYUCrlbbK0HnAue6ivFenZZzvQrQ/formResponse';
const ENTRY={"q1": "entry.1511735060", "q2": "entry.2093901311", "q3": "entry.636722128", "q4": "entry.1768007111", "q5": "entry.892673283", "q6": "entry.1706822779", "q7": "entry.1445464607", "q8": "entry.317304061", "q9": "entry.1138359470", "q10": "entry.210063608", "q11": "entry.1153781138", "q12": "entry.398438221", "q13": "entry.184744674", "q14": "entry.1886173929", "q15": "entry.1371436572", "q16": "entry.1198441346", "q17": "entry.830418336", "nome": "entry.133728254", "contato": "entry.1837454833", "aceite": "entry.950431572", "origem": "entry.649305740"};

const Q=[
 {k:'q1',b:'Sua casa',t:'Quem cuida da comida na sua casa?',o:['Eu, principalmente','Divido com outra pessoa','Outra pessoa cuida']},
 {k:'q2',b:'Sua casa',t:'Quantas pessoas moram na sua casa, contando você?',o:['1','2','3','4','5 ou mais']},
 {k:'q3',b:'Sua casa',t:'Tem crianças ou adolescentes em casa?',o:['Sim','Não']},
 {k:'q4',b:'Últimos dias',t:'Nos últimos 7 dias, quantas vezes vocês pediram delivery de refeição?',o:['Nenhuma','1','2 ou 3','4 a 6','7 ou mais']},
 {k:'q5',b:'Últimos dias',t:'Na última vez que pediram, qual foi o principal motivo?',o:['Sem tempo ou cansado(a)','Não sabia o que fazer','Faltava ingrediente','Vontade de algo específico','Ocasião especial'],if:a=>a.q4&&a.q4!=='Nenhuma'},
 {k:'q6',b:'Últimos dias',t:'Nos últimos 30 dias, você jogou fora comida que estragou?',o:['Não','1 ou 2 vezes','Toda semana','Várias vezes por semana']},
 {k:'q7',b:'Últimos dias',t:'Como você faz a lista do mercado hoje?',o:['Não faço lista','De cabeça','Papel','Bloco de notas do celular','WhatsApp','App de lista']},
 {k:'q8',b:'Últimos dias',t:'Com que frequência você volta do mercado tendo esquecido algo ou comprado repetido?',o:['Quase nunca','Às vezes','Quase sempre']},
 {k:'q9',b:'O que incomoda',t:'O que mais te incomoda hoje?',h:'Escolha até 2.',multi:2,o:['Decidir o que fazer todo dia','Gastar com delivery','Comida estragando','Esquecer coisas ou gastar demais no mercado','Organizar marmitas e lanches','Nada disso me incomoda'],none:'Nada disso me incomoda'},
 {k:'q10',b:'O que incomoda',t:'Já tentou organizar isso com app, planilha ou cardápio?',o:['Nunca','Tentei e parei','Uso hoje']},
 {k:'q11',b:'O que incomoda',t:'Por que parou?',o:['Dava trabalho manter','Não tinha a comida que eu faço','Esqueci de usar','Era difícil ou em inglês','Era pago'],if:a=>a.q10==='Tentei e parei'},
 {k:'concept',type:'concept'},
 {k:'q12',b:'A ideia',t:'O que você mais usaria?',h:'Escolha até 2.',multi:2,o:['Sugestão com o que tenho em casa','Cardápio da semana','Lista de compras compartilhada','Aviso de validade','Marmitas e lanches','Controle de gasto no mercado']},
 {k:'q13',b:'A ideia',t:'Qual a chance de você usar isso toda semana?',scale:['Nenhuma','Pouca','Talvez','Boa','Muito alta']},
 {k:'q14',b:'A ideia',t:'Se custasse R$ 9,90 por mês, com 7 dias grátis para testar, você:',o:['Assinaria com certeza','Provavelmente assinaria','Talvez','Provavelmente não','Com certeza não']},
 {k:'q15',b:'A ideia',t:'Quanto você pagaria por mês, no máximo?',o:['Só usaria grátis','Até R$ 5','Até R$ 10','Até R$ 15','Até R$ 20','Mais de R$ 20']},
 {k:'q16',b:'Você',t:'Sua faixa de idade',o:['18 a 24','25 a 34','35 a 44','45 a 54','55 ou mais']},
 {k:'q17',b:'Você',t:'Quer testar o Já Tem antes de todo mundo?',h:'Quem deixar o contato ganha 1 mês grátis no lançamento, sem precisar de cartão de crédito.',o:['Sim, me avisa','Não, obrigado(a)']},
 {k:'contato',type:'contact',if:a=>a.q17==='Sim, me avisa'}
];
const ans={}, hist=[];let cur=-1;
const $=s=>document.querySelector(s), S=$('#screen');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const q=new URLSearchParams(location.search);ans.origem=q.get('utm_source')||q.get('origem')||'direto';
if(!FORM_URL)$('#testnote').hidden=false;
const visible=()=>Q.filter(x=>!x.if||x.if(ans));
function nextIndex(from){for(let i=from+1;i<Q.length;i++){if(!Q[i].if||Q[i].if(ans))return i}return Q.length}
function progress(){const v=visible(),pos=v.indexOf(Q[cur]);const p=Math.round((pos)/(v.length)*100);$('#progi').style.width=p+'%';$('#count').textContent=(pos+1)+'/'+v.length;document.querySelector('.prog').setAttribute('aria-valuenow',p)}
function go(i,push=true){if(push&&cur>=0)hist.push(cur);cur=i;$('#back').disabled=!hist.length;if(i>=Q.length)return finish();$('#bar').hidden=false;progress();render(Q[i]);window.scrollTo(0,0)}
function back(){if(!hist.length)return;cur=hist.pop();$('#back').disabled=!hist.length;$('#bar').hidden=false;progress();render(Q[cur])}
$('#back').addEventListener('click',back);

function render(x){
  if(x.type==='concept'){S.innerHTML=`<p class="kicker">A ideia</p><div class="concept"><h2>Conheça o Já Tem</h2><p>Um app que organiza a comida da sua casa.</p><ul><li>Mostra o que dá pra fazer com o que você já tem</li><li>Monta o cardápio da semana</li><li>Faz a lista de compras e compartilha com a família</li></ul></div><button class="btn green" id="nx">Entendi, continuar</button>`;$('#nx').onclick=()=>go(nextIndex(cur));$('#nx').focus();return}
  if(x.type==='contact'){S.innerHTML=`<p class="kicker">Quase lá</p><h2>Para onde mandamos o convite?</h2>
    <div class="field"><label for="c-nome">Seu nome</label><input id="c-nome" autocomplete="given-name" value="${esc(ans.nome||'')}"></div>
    <div class="field"><label for="c-ct">WhatsApp ou e-mail</label><input id="c-ct" autocomplete="email" value="${esc(ans.contato||'')}"></div>
    <label class="consent"><input type="checkbox" id="c-ok" ${ans.aceite?'checked':''}><span>Aceito receber mensagens do Já Tem sobre o lançamento. Uso seus dados só para isso e você pode sair quando quiser.</span></label>
    <p class="err" id="c-err" hidden></p><button class="btn" id="nx">Enviar respostas</button>`;
    $('#nx').onclick=()=>{const n=$('#c-nome').value.trim(),c=$('#c-ct').value.trim(),ok=$('#c-ok').checked,e=$('#c-err');
      const valid=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c)||c.replace(/\D/g,'').length>=10;
      if(!n){e.textContent='Diga seu nome.';e.hidden=false;return}
      if(!valid){e.textContent='Confira o WhatsApp (com DDD) ou o e-mail.';e.hidden=false;return}
      if(!ok){e.textContent='Marque o aceite para receber o convite.';e.hidden=false;return}
      ans.nome=n;ans.contato=c;ans.aceite='sim';go(Q.length)};return}
  const multi=x.multi||0, sel=new Set(multi?(ans[x.k]||'').split(' | ').filter(Boolean):[]);
  let body;
  if(x.scale){body=`<div class="scale">${x.scale.map((l,i)=>`<button class="opt" data-v="${esc(l)}" aria-pressed="${ans[x.k]===l}"><b>${i+1}</b>${esc(l)}</button>`).join('')}</div>`}
  else body=`<div class="opts" role="group" aria-label="${esc(x.t)}">${x.o.map(l=>`<button class="opt" data-v="${esc(l)}" aria-pressed="${multi?sel.has(l):ans[x.k]===l}">${multi?'<span class="tick"></span>':''}${esc(l)}</button>`).join('')}</div>`;
  S.innerHTML=`<p class="kicker">${esc(x.b)}</p><h2>${esc(x.t)}</h2>${x.h?`<p class="hint">${esc(x.h)}</p>`:''}${body}${multi?`<button class="btn" id="nx" ${sel.size?'':'disabled'}>Continuar</button>`:''}`;
  S.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.v;
    if(!multi){ans[x.k]=v;S.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',o===b));setTimeout(()=>go(nextIndex(cur)),220);return}
    if(v===x.none){sel.clear();sel.add(v)}else{sel.delete(x.none);if(sel.has(v))sel.delete(v);else if(sel.size<multi)sel.add(v);else return}
    S.querySelectorAll('.opt').forEach(o=>o.setAttribute('aria-pressed',sel.has(o.dataset.v)));
    ans[x.k]=[...sel].join(' | ');$('#nx').disabled=!sel.size;
  }));
  if(multi)$('#nx').onclick=()=>go(nextIndex(cur));
}

function send(){
  if(!FORM_URL)return;
  const p=new URLSearchParams();
  Object.keys(ENTRY).forEach(k=>{if(ans[k]!==undefined)p.append(ENTRY[k],ans[k])});
  fetch(FORM_URL,{method:'POST',mode:'no-cors',body:p}).catch(()=>{});
}
function finish(){
  send();$('#bar').hidden=true;
  const site='https://jatemapp.github.io/';
  const msg='Respondi uma pesquisa de 3 minutos sobre comida em casa, para um app que ajuda a pedir menos delivery. Me ajuda respondendo também? '+site+'pesquisa?utm_source=repasse';
  S.innerHTML=`<svg width="64" height="64" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#16432B"/><path d="M11 21.5l6 6 12-14" fill="none" stroke="#FFC53D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>Obrigada!</h1><p>${ans.q17==='Sim, me avisa'?'Você está na lista de quem testa primeiro. Avisamos assim que abrir.':'Suas respostas já ajudam muito a construir o Já Tem.'}</p>
   <p><b>Quer ajudar mais?</b> Repasse a pesquisa para quem cuida da comida de casa.</p>
   <div class="share"><a class="wa" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Repassar no WhatsApp</a><a href="${site}?utm_source=pesquisa" target="_blank" rel="noopener">Conhecer o Já Tem</a></div>`;
}

function start(){
  S.innerHTML=`<p class="kicker">Pesquisa rápida · Já Tem</p><h1>Como é a comida aí na sua casa?</h1>
   <p>3 minutos, quase tudo com um toque. Suas respostas ajudam a criar um app para pedir menos delivery e jogar menos comida fora.</p>
   <p class="hint">Não tem resposta certa. É anônimo, a menos que você queira deixar seu contato no final.</p>
   <button class="btn" id="nx">Começar</button>`;
  $('#nx').onclick=()=>go(0,false);
}
start();
})();
</script>

</body>
</html>
